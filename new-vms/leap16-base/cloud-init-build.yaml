#cloud-config
# cloud-init-build.yaml
#
# Used by harvester-build-pipeline.sh to provision the build VM.
# This MUST end with the seal + poweroff sequence so the pipeline
# can detect completion by watching for the VM to stop.

package_update: true

packages:
  - google-guest-agent
  - google-guest-configs
  - google-guest-oslogin
  - google-osconfig-agent

runcmd:
  # --- k3s install ---
  - INSTALL_K3S_SKIP_START=true INSTALL_K3S_SKIP_ENABLE=true INSTALL_K3S_EXEC="--disable=traefik --disable-network-policy" curl -sfL https://get.k3s.io | sh -
  - restorecon -Rv /usr/local/bin/k3s /usr/local/bin/crictl /usr/local/bin/ctr
  - systemctl enable --now k3s.service
  - export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

  # --- Wait for k3s to be ready ---
  - until kubectl get nodes 2>/dev/null | grep -q " Ready"; do sleep 5; done

  # --- Helm installs ---
  # Add your helm installs here, for example:
  # - helm repo add traefik https://traefik.github.io/charts
  # - helm repo update
  # - helm install traefik traefik/traefik --namespace traefik --create-namespace --wait

  # --- Enable Google Cloud guest environment services ---
  - systemctl enable google-guest-agent.service google-startup-scripts.service google-shutdown-scripts.service google-osconfig-agent.service

  # --- Zero free space so the raw export compresses better ---
  # dd writes zeros to fill free space, then deletes the file.
  # This makes qemu-img convert drop those blocks as sparse.
  - dd if=/dev/zero of=/zero-fill bs=1M || true
  - rm -f /zero-fill
  - sync

  # --- Seal the image ---
  # Stop k3s and remove all machine-specific state so the image can be
  # used to create fresh VMs without identity conflicts.
  - k3s-killall.sh
  - rm -rf /var/lib/rancher/k3s/server/tls/
  - rm -rf /var/lib/rancher/k3s/server/cred/
  - rm -rf /var/lib/rancher/k3s/server/db/
  - rm -rf /var/lib/rancher/k3s/agent/

  # Reset cloud-init so it runs again on next boot
  - cloud-init clean --logs --seed --configs all

  # Remove machine identity so each VM gets a fresh one
  - rm -f /etc/machine-id
  - rm -f /var/lib/dbus/machine-id
  - truncate -s 0 /etc/hostname

  # Power off - pipeline detects completion by VM reaching Stopped state
  - systemctl poweroff
